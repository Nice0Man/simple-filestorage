name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
        
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ## Installation
          
          ### From Source
          \`\`\`bash
          git clone -b v${{ steps.version.outputs.version }} <repository-url>
          cd simple-filestorage
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          \`\`\`
          
          ### Using Docker
          \`\`\`bash
          docker pull ghcr.io/<owner>/simple-filestorage:${{ steps.version.outputs.version }}
          \`\`\`
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}

  build-artifacts:
    name: Build Release Artifacts
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            name: linux-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64-ubuntu22
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          postgresql-server-dev-all \
          pkg-config

    - name: Build
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build build

    - name: Create package
      run: |
        mkdir -p package/bin
        cp build/bin/fileserver package/bin/
        cp LICENSE package/
        cp README.md package/
        tar -czf fileserver-${{ matrix.name }}.tar.gz -C package .

    - name: Upload artifact to release
      uses: softprops/action-gh-release@v1
      with:
        files: fileserver-${{ matrix.name }}.tar.gz

  build-docker:
    name: Build and Push Docker Image
    needs: create-release
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/simple-filestorage:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/simple-filestorage:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

