name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        build_type: [Debug, Release]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          g++ \
          clang \
          libssl-dev \
          pkg-config

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

    - name: Setup test environment
      run: |
        mkdir -p test_files
        echo "test content 1" > test_files/file1.txt
        echo "test content 2" > test_files/file2.txt  
        echo "test content 3" > test_files/file3.pdf

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose -C ${{ matrix.build_type }}

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: build/Testing/Temporary/

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-14 cppcheck

    - name: Check formatting
      continue-on-error: true
      run: |
        find include src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | \
        xargs -0 clang-format-14 --dry-run --Werror || echo "⚠️ Some files need formatting"

    - name: Run cppcheck
      continue-on-error: true
      run: |
        cppcheck --enable=warning,style,performance \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --suppress=unmatchedSuppression \
          --error-exitcode=1 \
          --inline-suppr \
          -I include \
          src/ tests/ || echo "⚠️ cppcheck found some issues"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-22.04
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build simple Docker image
      run: |
        docker build --target production-local -t fileserver:test . || echo "Docker build failed, but continuing"

